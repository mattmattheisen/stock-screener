name: CAN SLIM Adaptive Research Tests

on:
  push:
    branches:
      - research/canslim-adaptive-entry-study
    paths:
      - 'research/canslim_adaptive_entry_study/**'
      - '.github/workflows/canslim-adaptive-research.yml'
  pull_request:
    paths:
      - 'research/canslim_adaptive_entry_study/**'
      - '.github/workflows/canslim-adaptive-research.yml'

permissions:
  contents: read

jobs:
  isolated-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest sqlalchemy
      - name: Execute research-only tests
        run: python -m pytest -q research/canslim_adaptive_entry_study/test_*.py
