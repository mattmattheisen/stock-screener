name: CAN SLIM Free Data Contract
on:
  pull_request:
    paths:
      - 'research/canslim_free_data/**'
      - '.github/workflows/canslim-free-data.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s research/canslim_free_data/tests -v
